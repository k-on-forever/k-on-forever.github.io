# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: k-on-forever's Blog
subtitle: '热爱技术，享受生活'
description: '一个 Java / Spring 练习生的技术博客，记录 SSM、MySQL、Redis 等学习笔记与踩坑记录。'
keywords:
  - Java
  - Spring Boot
  - MySQL
  - Redis
  - SSM
  - 技术博客
  - 学习笔记
author: k-on-forever
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://kon-forever.cloud
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

index_generator:
  path: ''
  per_page: 10
  order_by: -date

default_category: uncategorized
category_map:
tag_map:

meta_generator: true

date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

per_page: 10
pagination_dir: page

include:
exclude:
ignore:

theme: butterfly

deploy:
  type: git
  repository: https://github.com/k-on-forever/k-on-forever.github.io.git
  branch: main
